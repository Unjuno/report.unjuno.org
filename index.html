<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="読んだ研究論文を、内容・根拠・限界とともに整理して紹介する個人研究ノート。">
    <meta name="theme-color" content="#f5f3ee">
    <title>Research Notes — unjuno</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f3ee;
        --ink: #202820;
        --muted: #687168;
        --line: #d9ddd3;
        --green: #315c48;
        --serif: Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
        --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.75;
      }
      a { color: inherit; }
      .page { width: min(100% - 3rem, 1100px); margin-inline: auto; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-block: 1.5rem;
        border-bottom: 1px solid var(--line);
      }
      .brand { font-size: .85rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .edition { color: var(--muted); font-size: .8rem; }
      main { padding-block: clamp(4rem, 10vw, 8rem); }
      .eyebrow { color: var(--green); font-size: .76rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 {
        max-width: 850px;
        margin: 1.25rem 0 1.5rem;
        font-family: var(--serif);
        font-size: clamp(2.8rem, 7vw, 6rem);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: 1.12;
      }
      .intro { max-width: 650px; color: #485149; font-size: clamp(1.05rem, 2vw, 1.25rem); }
      .rule { width: 3rem; height: 2px; margin-block: 3rem; background: var(--green); }
      .columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3rem; max-width: 850px; }
      h2 { margin: 0 0 .75rem; font-family: var(--serif); font-size: 1.35rem; font-weight: 400; }
      .columns p { margin: 0; color: var(--muted); font-size: .95rem; }
      .status { display: inline-flex; align-items: center; gap: .55rem; margin-top: 3.5rem; color: var(--muted); font-size: .82rem; }
      .status::before { width: .45rem; height: .45rem; border-radius: 50%; background: #a9ad9f; content: ""; }
      footer { padding-block: 1.25rem 2rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; }
      @media (max-width: 620px) {
        .page { width: min(100% - 2rem, 1100px); }
        .columns { grid-template-columns: 1fr; gap: 1.75rem; }
        .edition { max-width: 9rem; text-align: right; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="brand" href="/" aria-label="Research Notes ホーム">unjuno / research</a>
        <span class="edition">論文を読む、考える、伝える</span>
      </header>
      <main>
        <p class="eyebrow">Independent reading notes</p>
        <h1>研究を読み、<br>自分の言葉で考える。</h1>
        <p class="intro">ここでは、私が読んだ論文について、何を明らかにしようとしたのか、どのような根拠が示されたのか、そして何がまだ分からないのかを整理して紹介します。</p>
        <div class="rule" aria-hidden="true"></div>
        <section class="columns" aria-label="このサイトについて">
          <div>
            <h2>論文の紹介</h2>
            <p>研究の問い、方法、主な結果を、原文と出典をたどれる形でまとめます。</p>
          </div>
          <div>
            <h2>読み手としての評価</h2>
            <p>研究の強みや限界、自分の解釈を、論文が示す事実と分けて記します。</p>
          </div>
        </section>
        <p class="status">論文ノートを準備中</p>
      </main>
      <footer>個人による読書・考察の記録です。各論文の著者・出典を明記し、解釈と研究結果を区別して掲載します。</footer>
    </div>
  </body>
</html>
