name: Verify and mirror published Attention lesson
on:
  push:
    branches: ['sync/attention-sites-v225']
    paths: ['reproductions/attention-is-all-you-need/SHA256SUMS']
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths: ['reproductions/attention-is-all-you-need/SHA256SUMS']
permissions:
  contents: write
jobs:
  mirror:
    if: github.event_name == 'push' || (github.head_ref == 'sync/attention-sites-v225' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Download only the 104 approved public files and verify SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path, PurePosixPath
          from urllib.request import urlopen, Request
          from urllib.parse import quote
          from hashlib import sha256
          import re
          base = 'https://report-paper-library-preview.unjuno.chatgpt.site/notes/attention-is-all-you-need/learn/'
          root = Path('reproductions/attention-is-all-you-need/v225')
          manifest = Path('reproductions/attention-is-all-you-need/SHA256SUMS')
          items = [line.split('  ', 1) for line in manifest.read_text().splitlines()]
          assert len(items) == 104 and len({name for _, name in items}) == 104
          def copy(item):
              checksum, name = item
              p = PurePosixPath(name)
              assert (name == 'index.html' or p.parts[0] in ('media', 'fonts')) and not p.is_absolute() and '..' not in p.parts
              assert re.fullmatch('[0-9a-f]{64}', checksum)
              url = base if name == 'index.html' else base + quote(name)
              with urlopen(Request(url, headers={'Accept-Encoding':'identity'}), timeout=45) as response:
                  data = response.read(7_000_000)
              if sha256(data).hexdigest() != checksum:
                  raise RuntimeError('Public bytes do not match saved v225: ' + name)
              dest = root / p
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              return len(data)
          with ThreadPoolExecutor(max_workers=6) as pool:
              size = sum(pool.map(copy, items))
          assert size == 80138330
          print('Verified 104 files,', size, 'bytes.')
          PY
      - name: Commit the verified reproduction to this branch only
        shell: bash
        run: |
          test "$(git branch --show-current)" = "sync/attention-sites-v225"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force -- reproductions/attention-is-all-you-need/v225
          git diff --cached --quiet && exit 0
          git commit -m 'Mirror the verified Sites v225 Attention lesson'
          git push origin HEAD:refs/heads/sync/attention-sites-v225
